<!DOCTYPE html>
<html>
<head>
    <title>Choose Version</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        .popup {
            background-color: #222;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .popup button {
            margin: 10px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .regular-btn {
            background-color: #4CAF50;
        }

        .modded-btn {
            background-color: #2196F3;
        }

        .popup button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="popup">
        <h2>Regular or Modded</h2>
        <button class="regular-btn" onclick="location.href='minecraftnormal.html'">Regular</button>
        <button class="modded-btn" onclick="location.href='https://example.com/modded'">Modded</button>
    </div>

</body>
</html>
