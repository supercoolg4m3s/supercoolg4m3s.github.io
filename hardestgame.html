<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>World's Hardest Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #ruffle-container {
      width: 100vw;
      height: 100vh;
    }

    #ruffle-container > * {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <!-- Ruffle polyfill -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
  <div id="ruffle-container"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();

      const container = document.getElementById("ruffle-container");
      container.appendChild(player);

      // Load your SWF (same folder as this HTML)
      player.load("https://supercoolg4m3s.github.io/theworldshardestgame.swf");
    });
  </script>
</body>
</html>
