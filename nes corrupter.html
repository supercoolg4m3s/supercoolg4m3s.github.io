<html>
<head>

}

#savePopup.show {

  opacity: 1;
}


    canvas {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  /* Maintain NES aspect ratio (8:7) */
  width: auto;
  height: 100%;

  /* Prevent overflow */
  max-height: 100%;
  max-width: 100%;

  image-rendering: pixelated;
  background: #000;
  z-index: 1;
}


    .controls {
      background: #111;
      border-top: 1px solid #333;

      display: flex;
      align-items: center;

      font-size: 14px;

    .controls button {
      background: #222;

    .spacer {

    .overlay {

    .overlay.active {

    .overlay-inner {

    .slot-list {

    .slot-item {

      border: 1px solid #444;
      cursor: pointer;

  const btnToggleDebug = document.getElementById("btnToggleDebug");

const REWIND_DURATION = 120 * 1000; // 2 minutes in ms
const REWIND_INTERVAL = 100;        // snapshot every 100ms (10 per second)

let rewindBuffer = [];
let lastSnapshotTime = 0;
let rewinding = false;


  let nes = null;
  let romData = null;
  let running = false;

  let auto = false;
  let autoTimer = null;

  const saveSlots = [null, null, null, null, null];
  let selectedSlot = 0;

  let debugEnabled = false;
  let audioEnabled = true;

  let fpsCap = 65;
  let lastFrameTime = 0;

let currentROM = null;

//const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
///const scriptNode = audioCtx.createScriptProcessor(1024, 0, 2);

const audioCtx = new AudioContext();
audioCtx.audioWorklet.addModule("nes-audio-worklet.js");

const nesNode = new AudioWorkletNode(audioCtx, "nes-audio");
nesNode.connect(audioCtx.destination);

function loadROMIntoNES(binaryString) {
    currentROM = binaryString;
    nes.loadROM(binaryString);
}

function updateRewindSystem() {
    const now = performance.now();

    // Only snapshot every REWIND_INTERVAL ms
    if (now - lastSnapshotTime < REWIND_INTERVAL) return;
    lastSnapshotTime = now;

    // Save state
    const state = nes.toJSON();
    rewindBuffer.push({ time: now, state });

    // Remove states older than 2 minutes
    const cutoff = now - REWIND_DURATION;
    while (rewindBuffer.length && rewindBuffer[0].time < cutoff) {
        rewindBuffer.shift();
    }
}

let lastFrameBuffer = null;


function onFrame(frameBuffer) {
    lastFrameBuffer = frameBuffer; // store for rewind

    const imageData = ctx.createImageData(256, 240);
    for (let i = 0; i < frameBuffer.length; i++) {
        const pixel = frameBuffer[i];
        imageData.data[i * 4 + 0] = pixel & 0xFF;
        imageData.data[i * 4 + 1] = (pixel >> 8) & 0xFF;
        imageData.data[i * 4 + 2] = (pixel >> 16) & 0xFF;
        imageData.data[i * 4 + 3] = 0xFF;
    }
    ctx.putImageData(imageData, 0, 0);
}

function processRewind() {
    if (!rewinding) return;
    if (rewindBuffer.length < 2) return;

    rewindBuffer.pop();
    const last = rewindBuffer[rewindBuffer.length - 1];
    nes.fromJSON(last.state);

    // Force a redraw using the last known framebuffer
    if (lastFrameBuffer) {
        onFrame(lastFrameBuffer);
    }
}



  function showError(msg) {
    stopAuto();
    errorMessage.textContent = msg;
    screenWrapper.classList.add("blurred");
    errorOverlay.classList.add("active");
    requestAnimationFrame(() => {
      errorBox.classList.add("visible");
    });
  }

  function hideError() {
    errorBox.classList.remove("visible");
    setTimeout(() => {
      errorOverlay.classList.remove("active");
      screenWrapper.classList.remove("blurred");
    }, 200);
  }

  function showSavePopup(text = "Saved!") {
    const popup = document.getElementById("savePopup");
    popup.textContent = text;

    popup.classList.add("show");

    setTimeout(() => {
        popup.classList.remove("show");
    }, 2000); // stays for 2 seconds
}


  errorBox.addEventListener("click", hideError);

  function initNES() {
    if (nes) return;
    nes = new jsnes.NES({
  onFrame(frameBuffer) { onFrame(frameBuffer); },
  onAudioSample(left, right) {
    nesNode.port.postMessage({ left, right });
  }
});

  }

  function startLoop() {
    if (running || !nes) return;
    running = true;

    function frame(timestamp) {
      if (!running) return;
      const delta = timestamp - lastFrameTime;
      const frameDuration = 1000 / fpsCap;

      if (delta >= frameDuration) {
        lastFrameTime = timestamp;
        try {
          if (rewinding) {
 processRewind();
 } 
else {
 nes.frame();
 updateRewindSystem();
 }
        } catch (e) {
          showError("Emulator error:\n" + e.message);
          running = false;
          return;
        }
      }
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  function binaryString(u8) {
    let s = "";
    for (let i = 0; i < u8.length; i++) {
      s += String.fromCharCode(u8[i]);
    }
    return s;
  }

  function isValidNESRom(u8) {
    return (
      u8.length > 16 &&
      u8[0] === 0x4E &&
      u8[1] === 0x45 &&
      u8[2] === 0x53 &&
      u8[3] === 0x1A
    );
  }

  function loadROMIntoNES() {
    if (!nes) initNES();
    nes.loadROM(binaryString(romData));
    startLoop();
  }

  function stopAuto() {
    auto = false;
    autoStatus.textContent = "Auto: OFF";
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
    }
  }

  function resetToDefaultState() {
    stopAuto();
    autoStatus.textContent = "Auto: OFF";
    romData = null;

    if (nes && nes.stop) nes.stop();
    nes = null;

    running = false;
    btnOpenReset.textContent = "Open NES";
    screenWrapper.classList.add("wallpaper");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    btnCorrupt.disabled = true;
    btnAuto.disabled = true;
    btnSaveLoad.disabled = true;
    btnCorruptType.disabled = true;
  }

  romFileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = new Uint8Array(ev.target.result);
        if (!isValidNESRom(data)) {
          showError("Selected file is not a valid NES ROM.");
          return;
        }

        romData = data;
        initNES();
        loadROMIntoNES();

        btnOpenReset.textContent = "Reset";
        screenWrapper.classList.remove("wallpaper");

        btnCorrupt.disabled = false;
        btnAuto.disabled = false;
        btnSaveLoad.disabled = false;
        btnCorruptType.disabled = false;
      } catch (err) {
        showError("Failed to load NES file:\n" + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  });

  const DEFAULT_ROM_URL =
    "https://raw.githubusercontent.com/vmartinv/nek/master/roms/Super%20Mario%20Bros.%20(Japan,%20USA).nes";

  async function loadDefaultROM() {
    try {
      const res = await fetch(DEFAULT_ROM_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const buf = await res.arrayBuffer();
      const data = new Uint8Array(buf);

      if (!isValidNESRom(data)) {
        showError("Default ROM is not a valid NES file.");
        return;
      }

      romData = data;
      initNES();
      loadROMIntoNES();

      btnOpenReset.textContent = "Reset";
      screenWrapper.classList.remove("wallpaper");

      btnCorrupt.disabled = false;
      btnAuto.disabled = false;
      btnSaveLoad.disabled = false;
      btnCorruptType.disabled = false;
    } catch (e) {
      showError("Failed to load default ROM:\n" + e.message);
    }
  }

  loadDefaultROM();

  const keyMap = {
    ArrowUp: 4,
    ArrowDown: 5,
    ArrowLeft: 6,
    ArrowRight: 7,
    z: 0,
    x: 1,
    Shift: 2,
    Enter: 3
  };

  document.addEventListener("keydown", e => {

    if (b !== undefined) {
      nes.buttonDown(1, b);
      e.preventDefault();
    }
  });

  document.addEventListener("keyup", e => {

      nes.buttonUp(1, b);

  const corruptionTypes = [
    "Random Bytes",
    "Bit Flip",
    "ByteSwap",
    "CheckerBoard",
    "TextureVomit",
    "EveryByte",
    "World Level Changer",
    "XOR Corruption",
    "StatChanger",
    "ByteSoundSwap"
  ];

  let currentCorruptTypeIndex = 0;

  function updateCorruptTypeButton() {
    btnCorruptType.textContent =
      "Type: " + corruptionTypes[currentCorruptTypeIndex];
  }
  updateCorruptTypeButton();

  function safeCorrupt(ram, intensity, fn) {
    const SAFE = [
      [0x0200, 0x1FFF],
      [0x0800, 0x3FFF],
      [0x6000, 0x7FFF],
      [0x8000, 0xFF00]
    ];
    for (let i = 0; i < intensity; i++) {
      const r = SAFE[Math.floor(Math.random() * SAFE.length)];
      const idx = r[0] + Math.floor(Math.random() * (r[1] - r[0]));
      if (idx < ram.length) fn(ram, idx);
    }
  }

  function corruptRandomBytes(ram, intensity) {
    safeCorrupt(ram, intensity, (ram, idx) => {
      ram[idx] = Math.floor(Math.random() * 256);
    });
  }

  function corruptBitFlip(ram, intensity) {
    safeCorrupt(ram, intensity, (ram, idx) => {
      const bit = 1 << (Math.floor(Math.random() * 8));
      ram[idx] ^= bit;
    });
  }

  function corruptByteSwap(ram, intensity) {
    safeCorrupt(ram, intensity, (ram, idxA) => {
      const idxB = Math.floor(Math.random() * ram.length);
      const tmp = ram[idxA];
      ram[idxA] = ram[idxB];
      ram[idxB] = tmp;
    });
  }

  function corruptCheckerBoard(ram, intensity) {
    safeCorrupt(ram, intensity, (ram, idx) => {
      ram[idx] = (idx % 2 === 0) ? 0x00 : 0xFF;
    });
  }

  function corruptTextureVomit(ram, intensity) {
    const pattern = [0x00, 0xFF, 0xAA, 0x55];
    safeCorrupt(ram, intensity, (ram, idx) => {
      ram[idx] = pattern[idx % pattern.length];
    });
  }

  function corruptEveryByte(ram) {
    for (let i = 0; i < ram.length; i++) {
      ram[i] = Math.floor(Math.random() * 256);
    }
  }

  function corruptWorldLevel(ram, intensity) {
    const start = 0x6000;
    const end = 0x7FFF;
    for (let i = 0; i < intensity; i++) {
      const idx = start + Math.floor(Math.random() * (end - start + 1));
      if (idx < ram.length) {
        ram[idx] = Math.floor(Math.random() * 256);
      }
    }
  }

  function corruptXOR(ram, intensity) {
    safeCorrupt(ram, intensity, (ram, idx) => {
      const mask = Math.floor(Math.random() * 256);
      ram[idx] ^= mask;
    });
  }

  function corruptStatChanger(ram) {
    for (let i = 0x0000; i <= 0x00FF && i < ram.length; i++) {
      ram[i] = Math.floor(Math.random() * 256);
    }
    for (let i = 0x0200; i <= 0x07FF && i < ram.length; i++) {
      ram[i] = Math.floor(Math.random() * 256);
    }
    for (let i = 0x6000; i <= 0x7FFF && i < ram.length; i++) {
      ram[i] = Math.floor(Math.random() * 256);
    }
  }

  function corruptByteSoundSwap(ram, intensity) {
    for (let i = 0; i < intensity; i++) {
      const idx = 0x4000 + Math.floor(Math.random() * 0x18);
      if (idx < ram.length) {
        ram[idx] = Math.floor(Math.random() * 256);
      }
    }
  }

  function corruptMemory() {
    if (!nes) return;
    const intensity = parseInt(intensitySlider.value, 10);
    const ram = nes.cpu.mem;
    const type = corruptionTypes[currentCorruptTypeIndex];

    try {
      switch (type) {
        case "Random Bytes":
          corruptRandomBytes(ram, intensity);
          break;
        case "Bit Flip":
          corruptBitFlip(ram, intensity);
          break;
        case "ByteSwap":
          corruptByteSwap(ram, intensity);
          break;
        case "CheckerBoard":
          corruptCheckerBoard(ram, intensity);
          break;
        case "TextureVomit":
          corruptTextureVomit(ram, intensity);
          break;
        case "EveryByte":
          corruptEveryByte(ram);
          break;
        case "World Level Changer":
          corruptWorldLevel(ram, intensity);
          break;
        case "XOR Corruption":
          corruptXOR(ram, intensity);
          break;
        case "StatChanger":
          corruptStatChanger(ram);
          break;
        case "ByteSoundSwap":
          corruptByteSoundSwap(ram, intensity);
          break;
      }
    } catch (e) {
      showError("Corruption error:\n" + e.message);
    }
  }

  function startAuto() {
    if (auto || !nes) return;
    auto = true;
    autoStatus.textContent = "Auto: ON";
    const interval = parseInt(intervalSlider.value, 10);
    autoTimer = setInterval(corruptMemory, interval);
  }

  function buildSlotUI() {
  slotList.innerHTML = "";
  const base = getRomName();

  for (let i = 0; i < 5; i++) {
    const key = `${base}_Slot${i + 1}`;
    const exists = localStorage.getItem(key) !== null;

    const item = document.createElement("div");
    item.className = "slot-item" + (i === selectedSlot ? " selected" : "");
    item.textContent = `Slot ${i + 1}` + (exists ? " ✓" : "");

    item.addEventListener("click", () => {
      selectedSlot = i;
      buildSlotUI();
    });

    slotList.appendChild(item);
  }
}

  
  function crc32(buf) {
  let table = crc32.table;
  if (!table) {
    table = crc32.table = [];
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) {
        c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      }
      table[i] = c;
    }
  }

  let crc = -1;
  for (let i = 0; i < buf.length; i++) {
    crc = (crc >>> 8) ^ table[(crc ^ buf[i]) & 0xFF];
  }
  return (crc ^ -1) >>> 0;
}


  function getRomName() {
  if (!romData) return "NO_ROM";

  const hash = crc32(romData).toString(16).toUpperCase();
  return "ROM_" + hash;
}

  const state = nes.toJSON();

  localStorage.setItem(key, JSON.stringify(state));
  console.log("Saved state:", key);
  buildSlotUI();
});





  btnLoadSlot.addEventListener("click", () => {
  if (!nes) return;

  const key = `${getRomName()}_Slot${selectedSlot + 1}`;
  const saved = localStorage.getItem(key);

  if (!saved) {
    showError("No save exists for this slot.");
    return;
  }

  const state = JSON.parse(saved);

  // IMPORTANT: do NOT recreate nes, do NOT reload ROM
  nes.fromJSON(state);

  console.log("Loaded state:", key);
  buildSlotUI();
});






  function openSaveOverlay() {
    buildSlotUI()
    screenWrapper.classList.add("blurred");
    saveOverlay.classList.add("active");
  }

  function closeSaveOverlay() {
    saveOverlay.classList.remove("active");
    screenWrapper.classList.remove("blurred");
  }

  btnSaveLoad.addEventListener("click", openSaveOverlay);
  btnCloseOverlay.addEventListener("click", closeSaveOverlay);
  
  document.addEventListener("keydown", e => {
  if (!e.code.startsWith("Digit")) return;

  const digit = parseInt(e.code.replace("Digit", ""));
  if (digit < 1 || digit > 5) return;

  const slot = digit - 1;
  selectedSlot = slot;
  const key = `${getRomName()}_Slot${slot + 1}`;

  // SHIFT + number → SAVE
  if (e.shiftKey) {
    if (!nes) return;

    const state = nes.toJSON();
    localStorage.setItem(key, JSON.stringify(state));

    showSavePopup(`Saved Slot ${slot + 1}`);
    console.log("Saved state:", key);
    e.preventDefault();
    return;
  }

  // number alone → LOAD
  const saved = localStorage.getItem(key);
  if (!saved) {
    showError("No save exists for this slot.");
    return;
  }

  const state = JSON.parse(saved);
  nes.fromJSON(state);

  showSavePopup(`Loaded Slot ${slot + 1}`);
  console.log("Loaded state:", key);
  e.preventDefault();
});





  buildSlotUI();

  btnAdvanced.addEventListener("click", () => {
    advancedOverlay.classList.add("active");
    screenWrapper.classList.add("blurred");
  });

  btnCloseAdvanced.addEventListener("click", () => {
    advancedOverlay.classList.remove("active");
    screenWrapper.classList.remove("blurred");
  });

  fpsCapInput.addEventListener("input", () => {
    fpsCap = parseInt(fpsCapInput.value, 10);
  });

  btnOpenConsole.addEventListener("click", () => {
    console.log(
      "%cOpen your browser’s developer tools (F12 or Ctrl+Shift+I).",
      "color:#0f0;font-size:16px;"
    );
    alert("Check the console — instructions printed there.");
  });

  btnToggleDebug.addEventListener("click", () => {
    debugEnabled = !debugEnabled;
    console.log("Debug mode:", debugEnabled);
  });

  btnToggleAudio.addEventListener("click", () => {
    audioEnabled = !audioEnabled;
    if (nes && nes.audio && nes.audio.ctx) {
      nes.audio.ctx[audioEnabled ? "resume" : "suspend"]();
    }
  });

  btnOpenReset.addEventListener("click", () => {
    if (!romData) {
      romFileInput.click();
    } else {
      resetToDefaultState();
    }
  });

  btnCorrupt.addEventListener("click", corruptMemory);

  btnAuto.addEventListener("click", () => {
    if (auto) stopAuto();
    else startAuto();
  });

  intensitySlider.addEventListener("input", e => {
    intensityVal.textContent = e.target.value;
  });

  intervalSlider.addEventListener("input", e => {
    intervalVal.textContent = e.target.value;
  });

  btnCorruptType.addEventListener("click", () => {
    currentCorruptTypeIndex =
      (currentCorruptTypeIndex + 1) % corruptionTypes.length;
    updateCorruptTypeButton();
  });
