<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis Corrupter</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #root {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    max-width: 100%;
    max-height: 100%;
  }
  #controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 12px;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-top: 1px solid #333;
  }
  #controls button,
  #controls select,
  #controls input[type="range"] {
    background: #111;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
  }
  #controls button:disabled {
    opacity: 0.4;
  }
  #intensity-wrapper {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #ccc;
    font-size: 11px;
  }
  #intensity {
    width: 140px;
  }
  #status {
    position: fixed;
    left: 8px;
    bottom: 40px;
    font-size: 11px;
    color: #aaa;
    white-space: pre-line;
    pointer-events: none;
    max-width: 40%;
  }
  #hint {
    position: fixed;
    right: 8px;
    bottom: 40px;
    font-size: 11px;
    color: #666;
    text-align: right;
    max-width: 40%;
  }
</style>
</head>
<body>

<div id="root">
  <canvas id="screen" width="320" height="224"></canvas>
</div>

<div id="controls">
  <button id="btn-open-reset" disabled>Open ROM</button>
  <input type="file" id="rom-file" accept=".bin,.md,.gen" style="display:none">

  <button id="btn-corrupt" disabled>Corrupt</button>
  <button id="btn-auto" disabled>Auto: Off</button>

  <div id="intensity-wrapper">
    <span>Intensity</span>
    <input type="range" id="intensity" min="1" max="500" value="50">
    <span id="intensity-label">50</span>
  </div>

  <select id="corrupt-type" disabled>
    <option>Random Bytes</option>
    <option>Bit Flip</option>
    <option>XOR</option>
    <option>Byte Swap</option>
  </select>

  <button id="btn-save" disabled>Save State</button>
  <button id="btn-load" disabled>Load State</button>
</div>

<div id="status">Loading core…</div>
<div id="hint">Arrows = D‑Pad · Z = B · X = A · C = C · Enter = Start</div>

<!-- MUST define Module.canvas BEFORE loading the core -->
<script>
  const canvas = document.getElementById("screen");

  window.Module = {
    canvas: canvas
  };
</script>

<!-- Load core JS (same folder) -->
<script src="genesis_plus_gx_libretro.js"></script>

<script>
/* -------------------------------------------------------
   BASIC SETUP
------------------------------------------------------- */

const ctx = canvas.getContext("2d");
let imageData = ctx.createImageData(canvas.width, canvas.height);

const btnOpenReset = document.getElementById("btn-open-reset");
const romFileInput = document.getElementById("rom-file");
const btnCorrupt = document.getElementById("btn-corrupt");
const btnAuto = document.getElementById("btn-auto");
const intensitySlider = document.getElementById("intensity");
const intensityLabel = document.getElementById("intensity-label");
const corruptTypeSelect = document.getElementById("corrupt-type");
const btnSave = document.getElementById("btn-save");
const btnLoad = document.getElementById("btn-load");
const statusEl = document.getElementById("status");

let romData = null;
let running = false;
let autoCorrupt = false;
let lastFrameTime = 0;
let fpsCap = 60;

function setStatus(msg) {
  statusEl.textContent = msg || "";
}

/* -------------------------------------------------------
   VIDEO CALLBACK
------------------------------------------------------- */

WebRetro.onFrame = function (buffer, width, height) {
  if (!buffer) return;

  if (width !== canvas.width || height !== canvas.height) {
    canvas.width = width;
    canvas.height = height;
    imageData = ctx.createImageData(width, height);
  }

  const dst = imageData.data;
  const len = Math.min(dst.length, buffer.length);
  for (let i = 0; i < len; i++) dst[i] = buffer[i];
};

/* -------------------------------------------------------
   ROM LOADING
------------------------------------------------------- */

function isValidGenesisRom(u8) {
  return (
    u8.length > 0x120 &&
    u8[0x100] === 0x53 &&
    u8[0x101] === 0x45 &&
    u8[0x102] === 0x47 &&
    u8[0x103] === 0x41
  );
}

romFileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    const data = new Uint8Array(ev.target.result);
    if (!isValidGenesisRom(data)) {
      setStatus("Not a valid Genesis ROM (missing SEGA header).");
      return;
    }
    romData = data;
    startGenesis();
  };
  reader.readAsArrayBuffer(file);
});

btnOpenReset.addEventListener("click", () => {
  if (!romData) romFileInput.click();
  else startGenesis();
});

async function startGenesis() {
  try {
    setStatus("Loading ROM…");
    await WebRetro.loadRom(romData);

    setStatus("Running. Use Corrupt or Auto.");
    btnOpenReset.textContent = "Reset";
    btnCorrupt.disabled = false;
    btnAuto.disabled = false;
    corruptTypeSelect.disabled = false;
    btnSave.disabled = false;
    btnLoad.disabled = false;

    running = true;
    lastFrameTime = performance.now();
    requestAnimationFrame(frameLoop);
  } catch (e) {
    setStatus("Error loading ROM:\n" + e.message);
  }
}

/* -------------------------------------------------------
   FRAME LOOP
------------------------------------------------------- */

function frameLoop(ts) {
  if (!running) return;

  const delta = ts - lastFrameTime;
  const frameDuration = 1000 / fpsCap;

  if (delta >= frameDuration) {
    lastFrameTime = ts;
    WebRetro.runFrame();
    ctx.putImageData(imageData, 0, 0);
    if (autoCorrupt) corruptMemory();
  }

  requestAnimationFrame(frameLoop);
}

/* -------------------------------------------------------
   CORRUPTION ENGINE
------------------------------------------------------- */

function getGenesisRAM() {
  return WebRetro.getMemory("SYSTEM_RAM");
}

function safeCorrupt(ram, intensity, fn) {
  if (!ram) return;
  for (let i = 0; i < intensity; i++) {
    const idx = (Math.random() * ram.length) | 0;
    fn(ram, idx);
  }
}

function corruptRandom(ram, n) {
  safeCorrupt(ram, n, (ram, i) => ram[i] = (Math.random() * 256) | 0);
}
function corruptBitFlip(ram, n) {
  safeCorrupt(ram, n, (ram, i) => ram[i] ^= 1 << ((Math.random() * 8) | 0));
}
function corruptXOR(ram, n) {
  const mask = (Math.random() * 256) | 0;
  safeCorrupt(ram, n, (ram, i) => ram[i] ^= mask);
}
function corruptSwap(ram, n) {
  safeCorrupt(ram, n, (ram, i) => {
    const j = (Math.random() * ram.length) | 0;
    const t = ram[i];
    ram[i] = ram[j];
    ram[j] = t;
  });
}

function corruptMemory() {
  const ram = getGenesisRAM();
  const n = parseInt(intensitySlider.value, 10);
  const type = corruptTypeSelect.value;

  if (!ram) return;

  switch (type) {
    case "Random Bytes": corruptRandom(ram, n); break;
    case "Bit Flip": corruptBitFlip(ram, n); break;
    case "XOR": corruptXOR(ram, n); break;
    case "Byte Swap": corruptSwap(ram, n); break;
  }
}

btnCorrupt.addEventListener("click", corruptMemory);

btnAuto.addEventListener("click", () => {
  autoCorrupt = !autoCorrupt;
  btnAuto.textContent = "Auto: " + (autoCorrupt ? "On" : "Off");
});

intensitySlider.addEventListener("input", () => {
  intensityLabel.textContent = intensitySlider.value;
});

/* -------------------------------------------------------
   SAVE STATES (localStorage)
------------------------------------------------------- */

btnSave.addEventListener("click", () => {
  const state = WebRetro.saveState();
  localStorage.setItem("GenesisCorrupter", JSON.stringify(Array.from(state)));
  setStatus("State saved.");
});

btnLoad.addEventListener("click", () => {
  const raw = localStorage.getItem("GenesisCorrupter");
  if (!raw) {
    setStatus("No saved state.");
    return;
  }
  const arr = new Uint8Array(JSON.parse(raw));
  WebRetro.loadState(arr);
  setStatus("State loaded.");
});

/* -------------------------------------------------------
   INPUT HANDLING
------------------------------------------------------- */

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  let h = true;

  switch (k) {
    case "arrowup": WebRetro.setButton(0, "UP", true); break;
    case "arrowdown": WebRetro.setButton(0, "DOWN", true); break;
    case "arrowleft": WebRetro.setButton(0, "LEFT", true); break;
    case "arrowright": WebRetro.setButton(0, "RIGHT", true); break;

    case "z": WebRetro.setButton(0, "B", true); break;
    case "x": WebRetro.setButton(0, "A", true); break;
    case "c": WebRetro.setButton(0, "C", true); break;
    case "enter": WebRetro.setButton(0, "START", true); break;

    default: h = false;
  }
  if (h) e.preventDefault();
});

document.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  let h = true;

  switch (k) {
    case "arrowup": WebRetro.setButton(0, "UP", false); break;
    case "arrowdown": WebRetro.setButton(0, "DOWN", false); break;
    case "arrowleft": WebRetro.setButton(0, "LEFT", false); break;
    case "arrowright": WebRetro.setButton(0, "RIGHT", false); break;

    case "z": WebRetro.setButton(0, "B", false); break;
    case "x": WebRetro.setButton(0, "A", false); break;
    case "c": WebRetro.setButton(0, "C", false); break;
    case "enter": WebRetro.setButton(0, "START", false); break;

    default: h = false;
  }
  if (h) e.preventDefault();
});

/* -------------------------------------------------------
   READY
------------------------------------------------------- */

btnOpenReset.disabled = false;
setStatus("Core loaded. Open a Genesis ROM to begin.");

</script>
</body>
</html>
