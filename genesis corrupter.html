<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Genesis Corrupter</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #root {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    max-width: 100%;
    max-height: 100%;
    transition: filter 0.2s ease;
  }
  #screen.blurred {
    filter: blur(4px);
  }
  #controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 12px;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-top: 1px solid #333;
    z-index: 10;
  }
  #controls button,
  #controls select,
  #controls input[type="range"] {
    background: #111;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 12px;
  }
  #controls button:disabled {
    opacity: 0.4;
  }
  #intensity-wrapper {
    display: flex;
    align-items: center;
    gap: 4px;
    color: #ccc;
    font-size: 11px;
  }
  #intensity {
    width: 140px;
  }
  #status {
    position: fixed;
    left: 8px;
    bottom: 40px;
    font-size: 11px;
    color: #aaa;
    white-space: pre-line;
    pointer-events: none;
    max-width: 40%;
    z-index: 10;
  }
  #hint {
    position: fixed;
    right: 8px;
    bottom: 40px;
    font-size: 11px;
    color: #666;
    text-align: right;
    max-width: 40%;
    z-index: 10;
  }
  #menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #menu-overlay.active {
    display: flex;
  }
  #menu-overlay h2 {
    margin-bottom: 12px;
    font-size: 16px;
    color: #fff;
  }
  #menu-overlay .slot-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #menu-overlay button {
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="root">
  <canvas id="screen" width="320" height="224"></canvas>
</div>

<div id="controls">
  <button id="btn-open-reset" disabled>Open ROM</button>
  <input type="file" id="rom-file" accept=".bin,.md,.gen" style="display:none">

  <button id="btn-corrupt" disabled>Corrupt</button>
  <button id="btn-auto" disabled>Auto: Off</button>

  <div id="intensity-wrapper">
    <span>Intensity</span>
    <input type="range" id="intensity" min="1" max="500" value="50">
    <span id="intensity-label">50</span>
  </div>

  <select id="corrupt-type" disabled>
    <option>Random Bytes</option>
    <option>Bit Flip</option>
    <option>XOR</option>
    <option>Byte Swap</option>
  </select>

  <button id="btn-save" disabled>Save State</button>
  <button id="btn-load" disabled>Load State</button>
</div>

<div id="status">Loading core…</div>
<div id="hint">Arrows = D‑Pad · Z = B · X = A · C = C · Enter = Start</div>

<div id="menu-overlay">
  <h2 id="menu-title">Choose a slot</h2>
  <div class="slot-buttons">
    <button data-slot="1">Slot 1</button>
    <button data-slot="2">Slot 2</button>
    <button data-slot="3">Slot 3</button>
    <button data-slot="4">Slot 4</button>
    <button data-slot="5">Slot 5</button>
  </div>
</div>

let imageData = ctx.createImageData(canvas.width, canvas.height);

const btnOpenReset = document.getElementById("btn-open-reset");
const romFileInput = document.getElementById("rom-file");
const btnCorrupt = document.getElementById("btn-corrupt");

let lastFrameTime = 0;
let fpsCap = 60;
let currentMenu = null;

function setStatus(msg) {
  statusEl.textContent = msg || "";
}

WebRetro.onCoreLoaded = function () {
  WebRetro.setCanvas(canvas);

  WebRetro.onFrame = function (buffer, width, height) {
    if (!buffer) return;
    if (width !== canvas.width || height !== canvas.height) {
      canvas.width = width;
      canvas.height = height;
      imageData = ctx.createImageData(width, height);
    }
    const dst = imageData.data;
    const len = Math.min(dst.length, buffer.length);
    for (let i = 0; i < len; i++) dst[i] = buffer[i];
  };

  btnOpenReset.disabled = false;
  setStatus("Core loaded. Open a Genesis ROM to begin.");
};

function isValidGenesisRom(u8) {
  return u8.length > 0x120 &&
    u8[0x100] === 0x53 &&
    u8[0x101] === 0x45 &&
    u8[0x102] === 0x47 &&
    u8[0x103] === 0x41;
}

romFileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const data = new Uint8Array(ev.target.result);
    if (!isValidGenesisRom(data)) {
      setStatus("Not a valid Genesis ROM.");
      return;
    }
    romData = data;
    startGenesis();
  };
  reader.readAsArrayBuffer(file);
});

btnOpenReset.addEventListener("click", () => {
  if (!romData) romFileInput.click();
  else startGenesis();
});
